name: Repository audit

on:
  pull_request:
  push:
    branches:
      - main
      - supplementary-experiments
      - repository-hardening
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out pointers without the full LFS payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.20"

      - name: Resolve only the supplementary figure payload
        shell: bash
        run: |
          git lfs install --local
          git lfs pull --include="MHFL-MCA Supplementary Experiments/**" --exclude=""

      - name: Verify repository and publication contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          python tools/verify_repository_contract.py --require-supplementary-lfs
          python "MHFL-MCA Supplementary Experiments/Codes/Revision Experiments/tools/validate_publication_package.py" --package-root "MHFL-MCA Supplementary Experiments"

      - name: Parse every Python and JSON file
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tools/verify_repository_contract.py --syntax-only

      - name: Check committed text for whitespace errors
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check --root HEAD
          fi

  supplementary-tests:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Check out pointers without datasets
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.20"

      - name: Install the locked validation environment
        shell: pwsh
        run: |
          python -m pip install --upgrade "pip==25.1"
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Run no-training supplementary tests
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        working-directory: MHFL-MCA Supplementary Experiments/Codes/Revision Experiments
        run: python -m pytest -q -p no:cacheprovider

      - name: Run static audit
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        working-directory: MHFL-MCA Supplementary Experiments/Codes/Revision Experiments
        run: python tools/static_audit.py .
